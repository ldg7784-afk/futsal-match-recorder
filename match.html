<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>경기 기록 운영원 | 학교폭력예방 풋살대회</title>
  <meta name="description" content="학교폭력예방 풋살대회 경기 기록 운영원 전용 앱 - 득점, 도움, 파울(5회 시 자동 퇴장), 출전 불가 및 경기 종료">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 운영판 추가 확장 스타일 (Tesla Design System 규격) */
    .game-status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--tesla-light-ash);
      color: var(--tesla-pewter);
      border: 1px solid var(--tesla-cloud-gray);
    }
    .game-status-badge.ended {
      background: #fee2e2;
      color: #b91c1c;
      border-color: #fca5a5;
    }
    .btn-end-match {
      background: #171a20;
      color: #ffffff;
      border: 1px solid #171a20;
    }
    .btn-end-match:hover {
      background: #b91c1c;
      border-color: #b91c1c;
    }
    .player-status-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 600;
      display: inline-block;
    }
    .status-active {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .status-suspended {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }
    .status-disqualified {
      background: #f3f4f6;
      color: #4b5563;
      border: 1px solid #d1d5db;
    }
    /* 슈팅 컨트롤 유닛 */
    .team-shots-ctrl {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 11px;
      color: var(--tesla-pewter);
      background: var(--tesla-white);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--tesla-cloud-gray);
    }
    .btn-shot-mini {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      border: 1px solid var(--tesla-pale-silver);
      background: var(--tesla-light-ash);
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 1. 최상단 헤더 -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand-badge">
          <span class="live-dot"></span>
          <span class="brand-sub">OPERATOR CONSOLE</span>
        </div>
        <h1 class="main-title">학교폭력예방 풋살대회 (경기 기록 운영)</h1>
      </div>

      <div class="header-right">
        <span class="game-status-badge" id="gameStatusBadge">경기 진행 중</span>

        <button id="endMatchBtn" class="btn-primary btn-end-match" title="경기 종료 시 학생 전광판에 최종 결과 표시">
          🏁 경기 종료 확정
        </button>

        <a href="scoreboard.html" target="_blank" class="btn-secondary" title="학생들이 보는 전광판 새 창 열기">
          🖥️ 학생 전광판 보기 ↗
        </a>
      </div>
    </header>

    <!-- 2. 상단 중앙 타이머 및 스코어보드 -->
    <section class="top-center-scoreboard glass-card">
      <!-- 1팀 요약 -->
      <div class="team-summary team-summary-1">
        <div class="team-name-editable-wrap">
          <input type="text" id="team1NameInput" class="team-name-input" value="1팀 (블루)" title="1팀 이름을 변경할 수 있습니다">
          <span class="team-sub-badge">TEAM 1</span>
        </div>
        <div class="team-big-score" id="team1Score">0</div>
        <div class="team-fouls-summary">팀 파울: <strong id="team1TotalFouls">0</strong>회 | 퇴장: <strong id="team1TotalRed">0</strong>명</div>
        <!-- 슈팅 카운트 -->
        <div class="team-shots-ctrl" title="1팀 총 슈팅 수 조작">
          <span>🎯 슈팅: <strong id="team1ShotsDisplay">0</strong></span>
          <button class="btn-shot-mini" id="team1ShotMinus">-</button>
          <button class="btn-shot-mini" id="team1ShotPlus">+</button>
        </div>
      </div>

      <!-- 중앙 15분 정밀 타이머 -->
      <div class="center-timer-wrap">
        <div class="timer-display-box">
          <div class="time-readout">
            <span id="timerMinutes" class="time-digit">15</span>
            <span class="time-colon">:</span>
            <span id="timerSeconds" class="time-digit">00</span>
          </div>
          <span class="timer-badge" id="timerPeriodBadge">15:00 정규 경기</span>
        </div>

        <div class="timer-progress-wrap">
          <div id="timerProgressBar" class="timer-progress-bar"></div>
        </div>

        <div class="timer-control-buttons">
          <button id="startTimerBtn" class="btn-timer btn-start" title="경기 시작">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <span>경기 시작</span>
          </button>

          <button id="pauseTimerBtn" class="btn-timer btn-pause" disabled title="일시 정지">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
            <span>일시정지</span>
          </button>

          <button id="resetTimerBtn" class="btn-timer btn-reset" title="15분 초기화">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span>리셋</span>
          </button>
        </div>

        <div class="timer-extra-chips">
          <button type="button" class="btn-chip" id="add1MinBtn">+1분</button>
          <button type="button" class="btn-chip" id="add5MinBtn">+5분</button>
          <button type="button" class="btn-chip" id="newMatchSessionBtn">새 경기 시작</button>
        </div>
      </div>

      <!-- 2팀 요약 -->
      <div class="team-summary team-summary-2">
        <div class="team-name-editable-wrap">
          <input type="text" id="team2NameInput" class="team-name-input" value="2팀 (오렌지)" title="2팀 이름을 변경할 수 있습니다">
          <span class="team-sub-badge">TEAM 2</span>
        </div>
        <div class="team-big-score" id="team2Score">0</div>
        <div class="team-fouls-summary">팀 파울: <strong id="team2TotalFouls">0</strong>회 | 퇴장: <strong id="team2TotalRed">0</strong>명</div>
        <!-- 슈팅 카운트 -->
        <div class="team-shots-ctrl" title="2팀 총 슈팅 수 조작">
          <span>🎯 슈팅: <strong id="team2ShotsDisplay">0</strong></span>
          <button class="btn-shot-mini" id="team2ShotMinus">-</button>
          <button class="btn-shot-mini" id="team2ShotPlus">+</button>
        </div>
      </div>
    </section>

    <!-- 3. 본문: 1팀(왼쪽)과 2팀(오른쪽) 2단 선수 기록 패널 -->
    <main class="teams-two-column-layout">
      <!-- 1팀 -->
      <section class="team-column team-1-column glass-card">
        <div class="team-column-header team-1-header">
          <div class="team-title-wrap">
            <span class="team-dot team-1-dot"></span>
            <h2 class="team-column-title" id="team1TitleDisplay">1팀 (블루)</h2>
            <span class="team-count" id="team1CountBadge">5명</span>
          </div>
          <button class="btn-outline-sm" id="addPlayer1Btn">+ 1팀 선수 추가</button>
        </div>
        <div class="players-stack" id="team1PlayersList"></div>
      </section>

      <!-- 2팀 -->
      <section class="team-column team-2-column glass-card">
        <div class="team-column-header team-2-header">
          <div class="team-title-wrap">
            <span class="team-dot team-2-dot"></span>
            <h2 class="team-column-title" id="team2TitleDisplay">2팀 (오렌지)</h2>
            <span class="team-count" id="team2CountBadge">5명</span>
          </div>
          <button class="btn-outline-sm" id="addPlayer2Btn">+ 2팀 선수 추가</button>
        </div>
        <div class="players-stack" id="team2PlayersList"></div>
      </section>
    </main>

    <!-- 4. 푸터 -->
    <footer class="app-footer">
      <div class="footer-content">
        <div class="footer-meta">
          <span>※ 파울이 5개가 되면 자동으로 퇴장(레드카드 1개) 및 '출전 불가' 처리됩니다.</span>
          <span>전광판 연동: LocalStorage 실시간 동기화 지원</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- 선수 추가 모달 -->
  <div class="modal-backdrop hidden" id="addPlayerModal">
    <div class="modal-dialog glass-card">
      <div class="modal-header">
        <h3 id="addPlayerModalTitle">새 선수 등록</h3>
        <button class="modal-close" id="closeAddPlayerModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="newPlayerName">선수 이름</label>
          <input type="text" id="newPlayerName" placeholder="예: 박지성" required>
        </div>
        <div class="form-group">
          <label for="newPlayerStudentNum">학번 (득점자 전광판 표시용)</label>
          <input type="text" id="newPlayerStudentNum" placeholder="예: 10101" required>
        </div>
        <div class="form-group">
          <label for="newPlayerNumber">등번호</label>
          <input type="number" id="newPlayerNumber" placeholder="예: 7" min="1" max="99" required>
        </div>
        <div class="form-group">
          <label for="newPlayerTeamSelect">소속 팀</label>
          <select id="newPlayerTeamSelect">
            <option value="1">1팀 (왼쪽)</option>
            <option value="2">2팀 (오른쪽)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelAddPlayerBtn">취소</button>
        <button class="btn-primary" id="saveNewPlayerBtn">선수 추가</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
